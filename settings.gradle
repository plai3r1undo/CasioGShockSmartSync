pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}
rootProject.name = "Casio GShock Smart Sync"
include ':app'

// Build against a local GShockAPI checkout instead of the JitPack artifact:
//   ./gradlew assembleDebug -PlocalGShockApi=true   (expects ../GShockAPI)
if (providers.gradleProperty('localGShockApi').getOrElse('false') == 'true') {
    includeBuild('../GShockAPI') {
        dependencySubstitution {
            substitute module('com.github.plai3r1undo:GShockAPI') using project(':api')
        }
    }
}
